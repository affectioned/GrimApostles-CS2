name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild "CS2_DMA_RADAR.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          current="${GITHUB_REF_NAME}"
          prev=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${current}$" | head -n1 || true)
          {
            echo "body<<NOTES_EOF"
            if [ -z "$prev" ]; then
              echo "Initial release."
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${current}"
            else
              echo "## What's Changed"
              git log --pretty=format:'* %s (%h)' "${prev}..${current}"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${current}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: bin/Release/CS2_DMA_RADAR.exe
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
